[project]
name = "lukwolfly-bot"
version = "0.1.0"
description = "Bot do Telegram da Lukwolfly Atelier & Art — pedidos, vagas e agenda."
requires-python = ">=3.12"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
