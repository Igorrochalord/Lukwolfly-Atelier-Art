# Modo desenvolvimento: código montado do disco + `next dev` (hot reload).
#   ./lukwolfly.sh up --dev
services:
  app:
    image: node:22-bookworm-slim
    build: !reset null
    working_dir: /app
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    command: ["node", "node_modules/next/dist/bin/next", "dev", "-H", "0.0.0.0", "-p", "3000"]
    environment:
      NODE_ENV: development
      HOME: /tmp
      NEXT_TELEMETRY_DISABLED: "1"
      NODE_OPTIONS: --disable-warning=ExperimentalWarning
      DATA_DIR: /app/data
    volumes: !override
      - .:/app
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/robots.txt').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 30s
      start_period: 90s
      retries: 10
